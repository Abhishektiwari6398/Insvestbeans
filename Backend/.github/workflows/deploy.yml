name: Deploy InvestBeans

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get latest code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: Install and build Frontend
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build

      # Step 4: Install Backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm install

      # Step 5: Render handles deployment automatically after this build check passes